    <style>
      .twinkle { animation: twinkle ease-in-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
      .glow { animation: pulse 6s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .rise { animation: rise 1.2s ease-out both; }
      .rise.d2 { animation-delay: .35s; }
      .rise.d3 { animation-delay: .7s; }
      @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.2) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .6; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    </style>
