<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="840" height="210" role="img" aria-label="Luana da Silva, full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b1e"/><stop offset="1" stop-color="#2d0f30"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/><stop offset=".55" stop-color="#ff9ccb"/><stop offset="1" stop-color="#c9a3ff"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#ff4fa3" stop-opacity=".55"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#c9a3ff" stop-opacity=".4"/><stop offset="1" stop-color="#c9a3ff" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="840" height="210" rx="14"/></clipPath>
  </defs>
    <style>
      .fall { animation: fall linear infinite; }
      .spin { animation: spin linear infinite; transform-box: fill-box; transform-origin: center; }
      .glow { animation: pulse 6s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .rise { animation: rise 1.2s ease-out both; }
      .rise.d2 { animation-delay: .35s; }
      .rise.d3 { animation-delay: .7s; }
      @keyframes fall { from { transform: translate(0,-30px); } to { transform: translate(var(--sway),240px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .6; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    </style>
  <g clip-path="url(#card)">
