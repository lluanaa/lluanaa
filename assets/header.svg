th class="spin" style="animation-duration:4.3s" transform="scale(1.12)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#ffc4e1" opacity="0.55"/></g></g><g transform="translate(143 0)"><g class="fall" style="--sway:-40px;animation-duration:10.3s;animation-delay:-7.3s"><path class="spin" style="animation-duration:5.2s" transform="scale(1.16)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#ffc4e1" opacity="0.42"/></g></g><g transform="translate(450 0)"><g class="fall" style="--sway:60px;animation-duration:12.7s;animation-delay:-5.1s"><path class="spin" style="animation-duration:6.4s" transform="scale(1.22)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#ff4fa3" opacity="0.46"/></g></g><g transform="translate(519 0)"><g class="fall" style="--sway:-40px;animation-duration:12.0s;animation-delay:-8.3s"><path class="spin" style="animation-duration:6.0s" transform="scale(1.34)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#c9a3ff" opacity="0.72"/></g></g><g transform="translate(267 0)"><g class="fall" style="--sway:40px;animation-duration:11.8s;animation-delay:-2.6s"><path class="spin" style="animation-duration:5.9s" transform="scale(1.41)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#ff9ccb" opacity="0.80"/></g></g><g transform="translate(730 0)"><g class="fall" style="--sway:80px;animation-duration:11.3s;animation-delay:-2.8s"><path class="spin" style="animation-duration:5.7s" transform="scale(1.18)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#ff4fa3" opacity="0.64"/></g></g><g transform="translate(615 0)"><g class="fall" style="--sway:-40px;animation-duration:10.5s;animation-delay:-7.4s"><path class="spin" style="animation-duration:5.2s" transform="scale(0.73)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#ffc4e1" opacity="0.45"/></g></g><g transform="translate(816 0)"><g class="fall" style="--sway:-60px;animation-duration:7.7s;animation-delay:-2.9s"><path class="spin" style="animation-duration:3.8s" transform="scale(1.25)" d="M0 0C5-9 15-7 13 2 11 10 3 10 0 0Z" fill="#c9a